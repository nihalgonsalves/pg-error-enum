name: Sync Enum
on:
  workflow_dispatch: {}
  schedule:
    # https://crontab.guru/#0_9_*_*_1
    # At 09:00 on Monday.
    - cron: "0 9 * * 1"
permissions: {}
jobs:
  build:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ssh-key: ${{ secrets.ACTION_DEPLOY_KEY }}
          # needed to push the sync branch with the deploy key
          persist-credentials: true
      # waiting on: https://github.com/actions/setup-node/issues/531
      - run: corepack enable
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync
      - name: git config
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
      - name: git commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/sync-$(date +%s)"
          MESSAGE="feat: sync with latest Postgres Errors"

          # UNCOMMENT FOR TESTING #
          # echo "// test for ${BRANCH}" >> src/PostgresError.ts

          git checkout -b ${BRANCH}
          git add src/PostgresError.ts

          if [[ `git status --porcelain` ]]; then
            git commit --message "${MESSAGE}"
            git push -u origin ${BRANCH}

            gh pr create --title "${MESSAGE}" --body ""
          fi
